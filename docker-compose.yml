version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: seatreservation-postgres
    restart: always
    environment:
      POSTGRES_DB: seatreservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatreservation"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seatreservation-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/seatreservation}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DB_POOL_SIZE: 20
      MAX_SEATS_PER_USER_PER_SHOW: 4
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
